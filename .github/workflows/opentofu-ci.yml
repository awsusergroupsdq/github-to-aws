name: OpenTofu CI
run-name: OpenTofu CI · PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    paths:
      - "opentofu/**"
      - ".github/workflows/opentofu-ci.yml"

permissions:
  contents: read

concurrency:
  group: opentofu-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (opentofu/${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [infra, app]
    defaults:
      run:
        working-directory: opentofu/${{ matrix.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -input=false

      - name: Validate
        run: tofu validate
