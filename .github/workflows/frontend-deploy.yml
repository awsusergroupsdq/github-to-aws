name: Frontend Deploy
run-name: Frontend Deploy · ${{ github.ref_name }}

on:
  workflow_run:
    workflows: ["OpenTofu Apply (CodeBuild)"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: "us-east-1"
  TOFU_VERSION: 1.13.2

jobs:
  deploy:
    name: Build & deploy app/ dist to S3
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Wait for OpenTofu Apply to succeed on this ref
        if: >-
          github.event_name == 'push' &&
          contains(join(github.event.commits.*.modified, github.event.commits.*.added), 'opentofu/')
        run: |
          run_id=""
          conclusion=null
          for i in $(seq 1 60); do
            row=$(gh run list \
              --workflow "OpenTofu Apply (CodeBuild)" \
              --branch "${{ github.ref_name }}" \
              --head-sha "${{ github.sha }}" \
              --limit 1 \
              --json databaseId,conclusion \
              --jq ".[0]" || true)
            if [ -n "$row" ]; then
              run_id=$(echo "$row" | jq -r .databaseId)
              conclusion=$(echo "$row" | jq -r .conclusion)
              if [ "$conclusion" != "null" ]; then
                break
              fi
            fi
            echo "OpenTofu Apply still queued/running; waiting ($i/60)..."
            sleep 30
          done
          if [ -z "$run_id" ] || [ "$conclusion" != "success" ]; then
            echo "OpenTofu Apply did not succeed; refusing to deploy."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-frontend-deploy

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Read tofu outputs from state (bucket, distribution)
        working-directory: opentofu/app
        run: |
          tofu init -input=false
          echo "DEPLOY_BUCKET=$(tofu output -raw bucket_name)" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_DISTRIBUTION_ID=$(tofu output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_URL=$(tofu output -raw website_url)" >> "$GITHUB_ENV"

      - name: Sync dist/ to S3 bucket
        run: |
          aws s3 sync dist/ "s3://$DEPLOY_BUCKET" --delete \
            --no-progress
          aws s3 cp index.html "s3://$DEPLOY_BUCKET/index.html" --no-progress

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Show CloudFront URL
        if: ${{ env.CLOUDFRONT_URL != '' }}
        run: |
          echo "The app is available at: $CLOUDFRONT_URL"
          {
            echo "### Deployment complete"
            echo ""
            echo "CloudFront URL: $CLOUDFRONT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
