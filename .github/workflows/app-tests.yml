name: App unit tests
run-name: App unit tests · PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-tests.yml"

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (app/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
